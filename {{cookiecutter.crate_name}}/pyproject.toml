{%- if cookiecutter.python_interop == 'extension' -%}
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "{{cookiecutter.crate_name}}"
description = "{{cookiecutter.description or cookiecutter.project_name}}"
dynamic = ["version"]
requires-python = ">=3.13"
dependencies = []
{%- else -%}
[project]
name = "{{cookiecutter.crate_name}}-dev"
description = "Development environment for {{cookiecutter.project_name}}"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []
{%- endif %}

[dependency-groups]
dev = [
{%- if cookiecutter.python_interop == 'extension' %}
    "maturin>=1.15,<2",
{%- endif %}
    "prek>=0.5.2",
    "pytest>=9.1",
    "ruff>=0.16.6",
    "rumdl>=0.2.69",
    "ty>=0.0.79",
]

[tool.uv]
{%- if cookiecutter.python_interop == 'extension' %}
package = true

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "{{cookiecutter.__package_name}}._core"
python-source = "python"
features = ["pyo3/extension-module"]
{%- else %}
package = false
{%- endif %}

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TC", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
{%- if cookiecutter.python_interop == 'extension' %}
testpaths = ["python", "scripts", "tests"]
{%- else %}
testpaths = ["scripts"]
{%- endif %}
addopts = "--doctest-modules"
