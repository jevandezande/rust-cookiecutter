name: Release

on:
  push:
    tags: ['v*']

  # Re-run a release against the same tag without re-tagging; picked against a branch,
  # the version job stops it before anything is published
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Verify tag matches the workspace version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      # The README says bump first and tag second; this is what enforces it
      - shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  # What test.yml runs on every push, repeated here so a tag on a commit CI never saw cannot
  # publish untested
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2.9.2

      - run: uv sync --locked

      # `py-test` depends on `develop`; a separate step keeps a build failure out of the middle
      # of `mise run all`
      - run: mise run develop

      - run: mise run all

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            artifact: manylinux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
            artifact: manylinux-aarch64
          - os: macos-latest
            target: aarch64
            artifact: macos-aarch64
          - os: macos-15-intel
            target: x86_64
            artifact: macos-x86_64
          - os: windows-latest
            target: x64
            artifact: windows-x86_64

    name: Wheel ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    needs: version

    steps:
      - uses: actions/checkout@v7.0.1

      # No interpreter is installed first: abi3 builds without one, and emits a single
      # cp313-abi3 wheel per platform rather than one per Python version. `manylinux` is
      # ignored off Linux, where the build runs on the runner instead of in a container.
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: 'true'

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.artifact }}
          path: dist

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-sdist
          path: dist

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist, test]
    permissions:
      # Trusted Publishing swaps this OIDC token for a short-lived upload token, so there is no
      # PyPI API token to store. The publish action also attests provenance with it
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@v1.14.2
