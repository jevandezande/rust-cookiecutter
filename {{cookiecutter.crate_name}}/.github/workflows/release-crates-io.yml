name: Release

on:
  pull_request: {}
  push:
    branches: [master]
    tags: ['v*']

  # Re-run a release against the same tag without re-tagging; picked against a branch, `publish`
  # skips on its ref guard and only the dry-run job runs
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Surfaces metadata problems on every change, rather than at tag time
  dry-run:
    name: Publish dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2.9.2

      - run: uv sync --locked

      # Pin the interpreter crates/py links against, rather than letting pyo3 pick one
      - shell: bash
        run: echo "PYO3_PYTHON=$(uv python find)" >> "$GITHUB_ENV"

      - run: cargo publish --workspace --dry-run --locked

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: dry-run
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: jdx/mise-action@v4.3.0
      - uses: Swatinem/rust-cache@v2.9.2

      - run: uv sync --locked

      # Pin the interpreter crates/py links against, rather than letting pyo3 pick one
      - shell: bash
        run: echo "PYO3_PYTHON=$(uv python find)" >> "$GITHUB_ENV"

      - name: Verify tag matches the workspace version
        shell: bash
        run: |
          # Asserts rather than assumes that every member shares [workspace.package] version:
          # the path dependencies in Cargo.toml pin it a second time and can drift
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '
            [.packages[].version] | unique
            | if length == 1 then .[0] else error("workspace members disagree on version: \(.)") end
          ')
          tag=${GITHUB_REF_NAME#v}
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      # Through mise, so this is exactly what `mise run test` runs locally
      - run: mise run test -- --locked

      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth

      # Publishes every workspace member, in dependency order
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
