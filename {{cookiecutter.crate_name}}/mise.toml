{%- set extension = cookiecutter.python_interop == 'extension' -%}
# Dev environment and task definitions. `mise tasks` lists every task.
#
# `depends` runs in parallel; a `run` array runs in series. Tasks that rewrite the same files must
# be chained through a `run` array.

[settings]
lockfile = true

[tools]
uv = "latest"
"github:EmbarkStudios/cargo-deny" = "latest"
"github:taiki-e/cargo-llvm-cov" = "latest"

[env]
_.file = ".env"

# Puts .venv on PATH, so tasks call ruff, pytest, and python without a `uv run` prefix
_.python.venv = { path = ".venv", create = true }

UV_LOCKED = "1"

[hooks]
{%- if extension %}
enter = "uv sync --quiet --no-install-project"
{%- else %}
enter = "uv sync --quiet"
{%- endif %}

# ---------- Rust ----------

[tasks.build]
run = "cargo build --workspace"

[tasks.test]
run = "cargo test --workspace"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all --check"
{#- Two passes where a default feature exists to switch off: the CLI's `python` feature #}
{% if cookiecutter.crate_type != 'lib' and cookiecutter.python_interop == 'embedded' %}
[tasks.clippy]
description = "Lint every target, warnings as errors: default features, then without the CLI python feature"
run = [
    "cargo clippy --workspace --all-targets -- -D warnings",
    "cargo clippy --workspace --all-targets --no-default-features -- -D warnings",
]
{% else %}
[tasks.clippy]
description = "Lint every target, warnings as errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"
{% endif %}
[tasks.clippy-fix]
description = "Apply clippy suggestions in place"
run = "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings"

[tasks.docs]
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps"

[tasks.msrv]
description = "Verify the crate still builds on the MSRV declared in Cargo.toml"
run = "python scripts/check_msrv.py"

[tasks.bump-toolchain]
description = "Re-pin rust-toolchain.toml to the current stable, moving the MSRV with it"
run = ["python scripts/bump_toolchain.py", "mise run msrv"]

[tasks.lint]
description = "Format, then lint"
run = ["mise run fmt", "mise run clippy"]

# ---------- Performance ----------

[tasks.bench]
run = "cargo bench --workspace --benches"

[tasks.profile-build]
description = "Release build with debug symbols, for perf/samply"
run = "cargo build --profile profiling --workspace"

# ---------- Coverage ----------

[tasks.coverage]
description = "Line coverage over the workspace; HTML report in target/llvm-cov/html"
run = "cargo llvm-cov --workspace --html"

[tasks.coverage-summary]
description = "Coverage as a table on stdout, no report written"
run = "cargo llvm-cov --workspace --summary-only"
{% if cookiecutter.crate_type != 'lib' and cookiecutter.python_interop == 'embedded' %}
# ---------- Release ----------

[tasks.bundle]
description = "Self-contained bundle in dist/: the binary plus its own interpreter"
run = "python scripts/bundle.py"

[tasks.smoke-bundle]
description = "Prove the bundle ignores an ambient VIRTUAL_ENV"
run = "python scripts/smoke_bundle.py"
{% endif %}
# ---------- Python ----------

[tasks.lock-check]
run = "uv lock --check"

# UV_LOCKED is on for every other task, so re-resolving needs an explicit opt-out. Task-level env
# beats [env], and needs no shell-specific prefix.
[tasks.lock]
description = "Re-resolve uv.lock after editing dependencies"
env = { UV_LOCKED = "0" }
run = "uv lock"

[tasks.lock-upgrade]
description = "Bump uv.lock to the newest compatible versions"
env = { UV_LOCKED = "0" }
run = "uv lock --upgrade"

[tasks.py-fmt]
run = "ruff format"

[tasks.py-fmt-check]
run = "ruff format --check"

[tasks.py-lint]
run = "ruff check"

[tasks.py-types]
run = "ty check"
{% if extension %}
[tasks.develop]
description = "Build the extension module into .venv, in place"
run = "maturin develop --uv"

[tasks.wheel]
description = "Build a release wheel into dist/"
run = "maturin build --release --out dist"
{% endif %}
[tasks.py-test]
{%- if extension %}
depends = ["develop"]
{%- endif %}
run = "pytest"

# ---------- Markdown ----------

[tasks.md-fmt]
run = "rumdl fmt ."

[tasks.md-fmt-check]
run = "rumdl fmt --check ."

[tasks.md-check]
run = "rumdl check ."

# ---------- Supply chain ----------

[tasks.deny]
description = "License and advisory audit"
run = "cargo deny check"

# ---------- Aggregates ----------

[tasks.fix]
description = "Rewrite what can be fixed automatically"
run = [
    "mise run fmt",
    "mise run clippy-fix",
    "mise run py-fmt",
    "mise run md-fmt",
]

[tasks.check]
description = "Report only, safe for CI"
depends = ["lock-check"]
run = "mise run fmt-check ::: clippy ::: py-fmt-check ::: py-lint ::: py-types ::: md-fmt-check ::: md-check ::: docs"

[tasks.all]
depends = ["check"]
run = "mise run test ::: py-test"
