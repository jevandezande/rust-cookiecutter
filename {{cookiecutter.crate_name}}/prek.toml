#:schema https://www.schemastore.org/prek.json
exclude = '\.venv/'
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", priority = 0 },
    { id = "end-of-file-fixer", priority = 0 },
    { id = "check-toml", priority = 0 },
    { id = "check-yaml", priority = 0 },
    { id = "check-merge-conflict", priority = 0 },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock-check"
name = "uv lock --check"
language = "system"
entry = "mise run lock-check"
files = '^(pyproject\.toml|uv\.lock)$'
pass_filenames = false
priority = 5

[[repos.hooks]]
id = "rumdl-fmt"
name = "rumdl fmt"
language = "system"
entry = "mise run md-fmt"
types = ["markdown"]
pass_filenames = false
priority = 10

[[repos.hooks]]
id = "rumdl-check"
name = "rumdl check"
language = "system"
entry = "mise run md-check"
types = ["markdown"]
pass_filenames = false
priority = 11

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "mise run fmt"
types = ["rust"]
pass_filenames = false
priority = 20

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "mise run clippy"
files = '(\.rs|Cargo\.toml|Cargo\.lock)$'
pass_filenames = false
priority = 21

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "mise run py-fmt"
types_or = ["python", "pyi"]
pass_filenames = false
priority = 30

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "mise run py-lint -- --fix"
types_or = ["python", "pyi"]
pass_filenames = false
priority = 31

[[repos.hooks]]
id = "ty"
name = "ty"
language = "system"
entry = "mise run py-types"
types_or = ["python", "pyi"]
pass_filenames = false
priority = 32

[[repos.hooks]]
id = "cargo-test"
name = "cargo test"
language = "system"
entry = "mise run test"
files = '(\.rs|Cargo\.toml|Cargo\.lock)$'
pass_filenames = false
stages = ["pre-push"]
priority = 40

[[repos.hooks]]
id = "pytest"
name = "pytest"
language = "system"
entry = "mise run py-test"
files = '(\.pyi?|\.rs|Cargo\.toml|Cargo\.lock)$'
pass_filenames = false
stages = ["pre-push"]
priority = 41
