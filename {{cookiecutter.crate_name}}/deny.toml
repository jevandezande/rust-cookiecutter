# cargo-deny configuration. `mise run deny` and the generated CI deny job run `cargo deny check`.

[graph]
targets = []
all-features = false

[advisories]
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.8
private = { ignore = true }
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
wildcards = "allow"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
