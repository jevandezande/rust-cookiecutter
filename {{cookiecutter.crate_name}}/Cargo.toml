{%- set pkg = cookiecutter.__package_name -%}
{%- set crate = cookiecutter.crate_name -%}
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "{rust_msrv}"
authors = ["{{cookiecutter.author_name}}"]
readme = "README.md"
{%- if cookiecutter.license != 'None' %}
license = "{{cookiecutter.license}}"
{%- endif %}
repository = "{{cookiecutter.project_url}}"
keywords = [{{ cookiecutter.keywords.split() | map('tojson') | join(', ') }}]

[workspace.dependencies]
{{crate}} = { path = "crates/core", version = "0.0.1" }
{#- Only the embedded CLI depends on crates/py; the extension cdylib has no Rust consumer #}
{%- if cookiecutter.python_interop == 'embedded' %}
{{crate}}-python = { path = "crates/py", version = "0.0.1" }
{%- endif %}
{%- if cookiecutter.python_interop != 'none' %}
pyo3 = "0.29"
{%- endif %}
{#- Only `embedded` has build scripts; `extension` builds an abi3 cdylib with no build.rs #}
{%- if cookiecutter.python_interop == 'embedded' %}
pyo3-build-config = "0.29"
{%- endif %}
criterion = { version = "0.8", features = ["html_reports"] }
{%- if cookiecutter.crate_type != 'lib' %}
clap = { version = "4", features = ["derive"] }
{%- endif %}
{#- thiserror wraps {{pkg}}_python::PyError beside the core's error in the embedded CLI alone #}
{%- if cookiecutter.crate_type != 'lib' and cookiecutter.python_interop == 'embedded' %}
thiserror = "2"
{%- endif %}
{%- if cookiecutter.crate_type != 'lib' %}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
{%- endif %}

[workspace.lints.rust]
missing_docs = "warn"
{%- if cookiecutter.python_interop == 'embedded' %}
unsafe_code = "deny"
{%- else %}
unsafe_code = "forbid"
{%- endif %}
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "allow"
multiple_crate_versions = "allow"
# Demands keywords, categories, and a license of every crate, publishable or not
cargo_common_metadata = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.bench]
debug = true
strip = "none"
