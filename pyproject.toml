[project]
name = "rust-cookiecutter"
description = "Cookiecutter for setting up Rust projects with uv that just work"
license = "MIT"
version = "0.1.0"
readme = "README.md"
keywords = ["cookiecutter", "uv", "rust", "pyo3"]
authors = [{name = "Jonathon Vandezande"}]
requires-python = ">=3.13"
dependencies = ["cookiecutter>=2.6"]

[dependency-groups]
dev = [
    "jinja2>=3.1",
    "prek>=0.5.2",
    "pytest>=9.1",
    "pyyaml>=6",
    "ruff>=0.16.6",
    "rumdl>=0.2.69",
    "ty>=0.0.79",
]

[tool.ruff]
extend-exclude = ["\\{\\{cookiecutter.crate_name\\}\\}"]
line-length = 100

[tool.ruff.lint]
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming conventions
    "W",  # pycodestyle warnings
    "C4", # comprehensions
    "PL", # pylint
    "PT", # flake8-pytest-style
    "PIE", # misc lints
    "PYI", # flake8-pyi
    "TID", # tidy imports
    "TC", # type-checking imports
    "RUF", # Ruff-specific rules
    "RSE", # flake8-raise
    "ICN001", # unconventional-import-alias
]
ignore = [
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["hooks"]
addopts = "--doctest-modules"
doctest_optionflags = "NORMALIZE_WHITESPACE"
