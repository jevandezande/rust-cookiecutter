name: Test Rust Cookiecutter

on:
  pull_request: {}
  push:
    branches: master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hooks:
    name: Hooks
    runs-on: ubuntu-latest

    env:
      UV_LOCKED: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.3.0

      - run: uv sync --locked

      - name: Check TOML/YAML/whitespace
        run: |
          uv run -- prek run --all-files --show-diff-on-failure --color=always \
            check-toml \
            check-yaml \
            check-merge-conflict \
            trailing-whitespace \
            end-of-file-fixer

      - run: mise run all

  generate:
    name: Generate ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Option coverage runs on Linux. Windows proves mise activates .venv; macOS is the
        # bundle relocator that needs install_name_tool and ad-hoc codesign.
        include:
          - name: lib, proprietary
            os: ubuntu-latest
            crate_type: lib
            python_interop: embedded
            license: None
            release_ci: None
            coding_agent: None
          - name: both, binaries
            os: ubuntu-latest
            crate_type: both
            python_interop: embedded
            license: MIT
            release_ci: binaries
            coding_agent: Claude
          # The only leg with dependencies: cargo add, uv add, cargo-deny, and the metadata
          # pre-gen requires for a crates.io release
          - name: both, crates.io, with dependencies
            os: ubuntu-latest
            crate_type: both
            python_interop: embedded
            license: Apache-2.0
            release_ci: crates.io
            coding_agent: None
            cargo_dependencies: serde@1.0
            cargo_dev_dependencies: proptest
            python_dependencies: numpy
            description: Scores things through an embedded interpreter
            keywords: pyo3 embedding scoring
          # Pure Rust: the shared CLI with no python feature, the none fragments, and
          # release-binaries-pure.yml
          - name: both, binaries, no Python
            os: ubuntu-latest
            crate_type: both
            python_interop: none
            license: MIT
            release_ci: binaries
            coding_agent: Claude
          # Python imports Rust: the extension crates/py, its fragments, and release-pypi.yml,
          # which no other interop mode is allowed to select
          - name: both, pypi, extension module
            os: ubuntu-latest
            crate_type: both
            python_interop: extension
            license: MIT
            release_ci: pypi
            coding_agent: Codex
          # A wheel with no CLI, the likeliest `lib` use of `extension`: `set_crate_type` leaves
          # core and py behind. Also the only leg that copies BSD-3-Clause
          - name: lib, pypi, extension module
            os: ubuntu-latest
            crate_type: lib
            python_interop: extension
            license: BSD-3-Clause
            release_ci: pypi
            coding_agent: None
          # The extension crate builds no test harness, so this leg proves nothing in the
          # workspace needs python3.dll in reach at test time
          - name: both, pypi, extension module (Windows)
            os: windows-latest
            crate_type: both
            python_interop: extension
            license: MIT
            release_ci: pypi
            coding_agent: None
          - name: both, binaries (Windows)
            os: windows-latest
            crate_type: both
            python_interop: embedded
            license: MIT
            release_ci: binaries
            coding_agent: None
          - name: both, binaries (macOS)
            os: macos-latest
            crate_type: both
            python_interop: embedded
            license: MIT
            release_ci: binaries
            coding_agent: None

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v4.3.0

      # The locked cookiecutter, the same one the hook tests import
      - run: uv sync --locked

      - name: Configure git
        shell: bash
        run: |
          git config --global user.email "default@example.com"
          git config --global user.name "Default Name"
          git config --global init.defaultBranch master

      - name: Run cookiecutter
        shell: bash
        run: |
          # Unset matrix keys render as empty strings, which is what the defaults already are
          uv run cookiecutter . --no-input --config-file template_config.yml -o .. \
            crate_type=${{ matrix.crate_type }} \
            python_interop=${{ matrix.python_interop }} \
            license=${{ matrix.license }} \
            release_ci=${{ matrix.release_ci }} \
            coding_agent=${{ matrix.coding_agent }} \
            cargo_dependencies="${{ matrix.cargo_dependencies }}" \
            cargo_dev_dependencies="${{ matrix.cargo_dev_dependencies }}" \
            python_dependencies="${{ matrix.python_dependencies }}" \
            description="${{ matrix.description }}" \
            keywords="${{ matrix.keywords }}"

      # Windows has no rpath, and rustdoc runs doctests from a temporary directory that build.rs
      # does not stage, so the interpreter has to be findable on PATH
      - name: Put libpython on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: ../rust-project
        run: uv run python -c "import sys; print(sys.base_prefix)" >> "$GITHUB_PATH"

      - name: Check the generated project
        shell: bash
        working-directory: ../rust-project
        run: |
          mise run all
          uv run prek run -a --stage pre-push

      # The MSRV trails the pinned toolchain by MSRV_LAG minors. Only a leg with dependencies can
      # catch one of them moving its own rust-version past that window, which would break the
      # generated msrv job on a project's first push
      - name: MSRV
        if: matrix.cargo_dependencies != ''
        shell: bash
        working-directory: ../rust-project
        run: mise run msrv

      - name: cargo-deny
        if: matrix.release_ci == 'crates.io'
        shell: bash
        working-directory: ../rust-project
        run: mise run deny

      # The Linux relocator; macOS uses install_name_tool and codesign, Windows copies the DLL
      - name: Install patchelf
        if: matrix.crate_type == 'both' && matrix.python_interop == 'embedded' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Bundle
        if: matrix.crate_type == 'both' && matrix.python_interop == 'embedded'
        shell: bash
        working-directory: ../rust-project
        run: |
          if [ -n "${{ matrix.python_dependencies }}" ]; then
            uv run python scripts/bundle.py --keep-python-executable
          else
            mise run bundle
          fi

      - name: Smoke-test the bundle
        if: matrix.crate_type == 'both' && matrix.python_interop == 'embedded'
        shell: bash
        working-directory: ../rust-project
        run: |
          extra=()
          if [ -n "${{ matrix.python_dependencies }}" ]; then
            extra+=(--import numpy)
          fi
          uv run python scripts/smoke_bundle.py "${extra[@]}"
          if [ "$RUNNER_OS" != "Windows" ]; then
            env -i "$PWD/dist/bin/$(ls dist/bin | head -n1)"
          fi

      # The extension analogue of Bundle + Smoke-test: build the artifact a release would
      # publish, then import it outside the project venv rather than from the source tree
      - name: Build the wheel
        if: matrix.python_interop == 'extension'
        shell: bash
        working-directory: ../rust-project
        run: mise run wheel

      - name: Import the wheel
        if: matrix.python_interop == 'extension'
        shell: bash
        working-directory: ../rust-project
        run: |
          # Exactly one: `mise run wheel` writes to dist/, which nothing else in this leg touches,
          # so a second wheel or none at all means the build did not do what the release would
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected one wheel in dist/, found: ${wheels[*]:-none}"
            exit 1
          fi
          uv run --no-project --python 3.13 --with "${wheels[0]}" -- \
            python -c "import rust_project; assert rust_project.best_score([1, 16, 4]) == 4.0"
